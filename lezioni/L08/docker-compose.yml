services:
  greenmail:
    image: greenmail/standalone:2.1.8
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.smtp.hostname=0.0.0.0
        -Dgreenmail.smtp.port=3025
        -Dgreenmail.imap.hostname=0.0.0.0
        -Dgreenmail.imap.port=3143
        -Dgreenmail.users.login=email
        -Dgreenmail.users=${GREENMAIL_USERS}
    ports:
      - "3025:3025"
      - "3143:3143"

  roundcube:
    image: roundcube/roundcubemail
    depends_on:
      - greenmail
    ports:
      - "80:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_SMTP_USER: "%u"
      ROUNDCUBEMAIL_SMTP_PASS: "%p"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    volumes:
      - roundcube-data:/var/roundcube/db

volumes:
  roundcube-data:
